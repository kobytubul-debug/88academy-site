name: Google reviews

on:
  schedule:
    - cron: '17 5 * * *'   # every day, 07:17 Israel time (winter)
  workflow_dispatch: {}      # "Run workflow" button for an immediate refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch reviews from Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE_ID: ${{ vars.PLACE_ID }}
        run: node scripts/fetch-google-reviews.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- reviews.json 2>/dev/null && git ls-files --error-unmatch reviews.json >/dev/null 2>&1; then
            echo "No new reviews."; exit 0
          fi
          [ -f reviews.json ] || { echo "No reviews.json yet."; exit 0; }
          git config user.name "88academy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "Update Google reviews"
          git push
